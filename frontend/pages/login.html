<!DOCTYPE html>
<html lang="en" class="auth-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Log In — CineNova</title>
    <meta name="description" content="Log in to your CineNova account.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="no-sidebar auth-page">
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <main id="main-content" class="auth-shell">
        <div class="auth-card-outer">

            <!-- ==================== LEFT — BRAND PANEL ==================== -->
            <div class="auth-panel-brand">
                <div class="auth-poster-marquee hidden lg:flex" id="poster-marquee" aria-hidden="true"></div>
                <div class="auth-poster-overlay"></div>

                <div class="auth-panel-content">
                <a href="index.html" class="flex items-center gap-2" aria-label="CineNova — home">
                    <img src="../images/logo.png" alt="CineNova" class="h-8 w-8 object-contain flex-shrink-0" width="615" height="640" />
                    <span class="text-base font-bold text-white tracking-tight">Cine<span class="text-orange-500">Nova</span></span>
                </a>

                <div class="mt-4 sm:mt-8 lg:mt-10">
                    <p class="auth-eyebrow" id="auth-eyebrow"></p>
                    <h1 class="mt-1.5 text-xl sm:text-3xl lg:text-4xl font-extrabold text-white leading-tight">
                        Welcome<br><span class="text-orange-500">Back</span>
                    </h1>
                    <p class="hidden sm:block mt-3 text-sm text-gray-400 leading-relaxed max-w-xs">
                        Login to continue watching amazing movies and series.
                    </p>
                </div>

                <p class="hidden sm:block text-[11px] text-gray-500 mt-auto pt-6" id="auth-copyright"></p>
                </div>
            </div>

            <!-- ==================== RIGHT — LOGIN FORM ==================== -->
            <div class="auth-panel-form">
                <div class="auth-form-card">
                    <h2 class="text-xl sm:text-2xl font-bold text-white">Login</h2>
                    <p class="hidden sm:block mt-1 text-sm text-gray-400">Welcome back! Please login to your account.</p>

                    <div role="alert" id="auth-error" class="hidden mt-3 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-2.5 text-xs text-red-200"></div>

                    <form id="login-form" novalidate class="mt-3 sm:mt-5 space-y-2.5 sm:space-y-3.5">
                        <div>
                            <label for="username" class="block text-xs font-semibold text-gray-300 mb-1">Username</label>
                            <div class="auth-input-wrap">
                                <input type="text" id="username" name="username" required autocomplete="username" class="auth-input" placeholder="Enter your username" autofocus>
                                <span class="auth-input-icon" id="icon-user"></span>
                            </div>
                        </div>

                        <div>
                            <label for="password" class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                            <div class="auth-input-wrap">
                                <input type="password" id="password" name="password" required autocomplete="current-password" class="auth-input" placeholder="Enter your password">
                                <span class="auth-input-icon" id="icon-lock"></span>
                            </div>
                            <div class="text-right mt-1.5">
                                <a href="#" class="text-xs font-semibold text-orange-400 hover:text-orange-300 transition-colors">Forgot password?</a>
                            </div>
                        </div>

                        <label class="flex items-center gap-2.5 text-sm text-gray-300 cursor-pointer select-none">
                            <input type="checkbox" name="remember" class="auth-check">
                            Remember me
                        </label>

                        <button type="submit" id="login-submit" class="auth-submit-btn">Login <span id="icon-chevron"></span></button>
                    </form>

                    <div class="auth-divider my-3 sm:my-5">or continue with</div>

                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" class="auth-social-btn" aria-label="Continue with Google" id="btn-google"></button>
                        <button type="button" class="auth-social-btn" aria-label="Continue with Apple" id="btn-apple"></button>
                        <button type="button" class="auth-social-btn" aria-label="Continue with Facebook" id="btn-facebook"></button>
                    </div>

                    <p class="text-center text-sm text-gray-400 mt-3 sm:mt-5">
                        Don't have an account? <a href="signup.html" class="text-orange-400 font-semibold hover:underline">Sign up</a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <script src="../js/icons.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/common.js" defer></script>
    <script>
        document.getElementById('icon-user').innerHTML = cnIcon('user', 'w-[1.125rem] h-[1.125rem]');
        document.getElementById('icon-lock').innerHTML = cnIcon('lock', 'w-[1.125rem] h-[1.125rem]');
        document.getElementById('icon-chevron').innerHTML = cnIcon('chevron', 'w-4 h-4');
        document.getElementById('auth-eyebrow').innerHTML = cnIcon('sparkle', 'w-3.5 h-3.5') + ' Welcome';
        document.getElementById('auth-copyright').innerHTML = '&copy; ' + new Date().getFullYear() + ' CineNova. All rights reserved.<br>Watch more. Discover more.';
        document.getElementById('btn-google').innerHTML = cnIcon('google', 'w-5 h-5');
        document.getElementById('btn-apple').innerHTML = cnIcon('apple', 'w-5 h-5');
        document.getElementById('btn-facebook').innerHTML = cnIcon('facebook', 'w-5 h-5');

        // Already logged in? Skip straight past the login form.
        CNAuth.me().then((state) => { if (state.authenticated) window.location.href = 'index.html'; });

        // Poster marquee background, same 3-column layout as before.
        fetch('../../backend/api/catalog.php?type=trending&media=movie&limit=18')
            .then((r) => r.json())
            .then((res) => {
                const items = (res.data && res.data.items) || [];
                const posters = items.map((i) => i.poster_url).filter(Boolean);
                if (posters.length === 0) return;
                const cols = [[], [], []];
                for (let i = 0; i < 18; i++) cols[i % 3].push(posters[i % posters.length]);
                const marquee = document.getElementById('poster-marquee');
                marquee.innerHTML = cols.map((col, i) =>
                    '<div class="auth-poster-col ' + (i === 1 ? 'auth-poster-col--down' : 'auth-poster-col--slow') + '">' +
                        col.concat(col).map((src) => '<div class="auth-poster-card"><img src="' + src + '" alt="" loading="lazy"></div>').join('') +
                    '</div>'
                ).join('');
            });

        const params = new URLSearchParams(window.location.search);
        const returnUrl = params.get('return') || '';
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('auth-error');
        const submitBtn = document.getElementById('login-submit');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            CNAuth.login(username, password, returnUrl)
                .then((res) => {
                    const data = res.data;
                    if (data.return_url) {
                        window.location.href = data.return_url;
                    } else if (data.user.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                })
                .catch((err) => {
                    submitBtn.disabled = false;
                    errorBox.textContent = err.message || 'Incorrect username or password.';
                    errorBox.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
