<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — CineNova</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="sidebar-root"></div>

    <main id="main-content" class="max-w-2xl mx-auto px-4 sm:px-6 py-24 lg:py-16">
        <div id="profile-loading" class="text-center text-gray-500 py-16">Loading your profile…</div>

        <div id="profile-content" class="hidden">
            <div class="flex items-center gap-4 mb-8">
                <div id="profile-avatar" class="w-16 h-16 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 flex items-center justify-center text-2xl font-extrabold text-white uppercase flex-shrink-0"></div>
                <div class="min-w-0">
                    <h1 id="profile-username" class="text-2xl font-extrabold text-white truncate"></h1>
                    <p class="text-sm text-gray-400" id="profile-meta"></p>
                </div>
            </div>

            <a href="admin/dashboard.html" id="profile-admin-link" class="hidden glass-panel rounded-xl p-4 mb-6 items-center justify-between hover:border-orange-500/40 border border-white/10 transition-colors">
                <span class="text-sm font-semibold text-white flex items-center gap-2.5" id="profile-admin-label"></span>
                <span id="profile-admin-chevron"></span>
            </a>

            <div role="alert" id="profile-error" class="hidden rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200 mb-5"></div>
            <div role="status" id="profile-success" class="hidden rounded-xl border border-green-500/30 bg-green-500/10 px-4 py-3 text-sm text-green-200 mb-5"></div>

            <div class="glass-panel rounded-2xl p-6 border border-white/10">
                <h2 class="text-lg font-bold text-white mb-4">Account Details</h2>
                <form id="profile-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Username</label>
                        <input type="text" id="profile-username-field" disabled class="auth-input opacity-60">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Display name</label>
                        <input type="text" name="name" id="profile-name-field" class="auth-input">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Email</label>
                        <input type="email" name="email" id="profile-email-field" required class="auth-input">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-white/10">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1.5">Current password</label>
                            <input type="password" name="current_password" class="auth-input" placeholder="Required to set new password" autocomplete="current-password">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1.5">New password</label>
                            <input type="password" name="new_password" class="auth-input" placeholder="Leave blank to keep current" autocomplete="new-password">
                        </div>
                    </div>
                    <button type="submit" class="auth-submit-btn !w-auto px-6">Save Changes</button>
                </form>
            </div>

            <a href="#" data-action="logout" class="mt-6 flex items-center justify-center gap-2 text-sm font-semibold text-red-400 hover:text-red-300 transition-colors py-3">
                <span id="icon-logout"></span> Log Out
            </a>
        </div>
    </main>

    <script src="../js/icons.js"></script>
    <script src="../js/cards.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/common.js" defer></script>
    <script>
        document.getElementById('icon-logout').innerHTML = cnIcon('logout', 'w-4 h-4');
        CNSidebar.render({ activePage: '', mediaType: null });

        CNAuth.requireAuth().then(function (user) {
            document.getElementById('profile-loading').classList.add('hidden');
            document.getElementById('profile-content').classList.remove('hidden');

            document.getElementById('profile-avatar').textContent = user.username.charAt(0).toUpperCase();
            document.getElementById('profile-username').textContent = user.username;
            document.getElementById('profile-meta').textContent =
                (user.plan || 'Free') + ' plan' + (user.role === 'admin' ? ' · Administrator' : '') + ' · Joined ' + (user.joined || '—');
            document.getElementById('profile-username-field').value = user.username;
            document.getElementById('profile-name-field').value = user.name || '';
            document.getElementById('profile-email-field').value = user.email || '';

            if (user.role === 'admin') {
                const link = document.getElementById('profile-admin-link');
                link.classList.remove('hidden');
                link.classList.add('flex');
                document.getElementById('profile-admin-label').innerHTML = cnIcon('cog', 'w-[1.125rem] h-[1.125rem] text-orange-400') + ' Open Admin Panel';
                document.getElementById('profile-admin-chevron').innerHTML = cnIcon('chevron', 'w-4 h-4 text-gray-500');
            }
        });

        document.getElementById('profile-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const errorBox = document.getElementById('profile-error');
            const successBox = document.getElementById('profile-success');
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            CNAuth.updateProfile({
                name: document.getElementById('profile-name-field').value,
                email: document.getElementById('profile-email-field').value,
                current_password: document.querySelector('[name="current_password"]').value,
                new_password: document.querySelector('[name="new_password"]').value,
            }).then((res) => {
                successBox.textContent = res.message || 'Your profile was updated.';
                successBox.classList.remove('hidden');
                document.querySelector('[name="current_password"]').value = '';
                document.querySelector('[name="new_password"]').value = '';
            }).catch((err) => {
                errorBox.textContent = err.message || 'Something went wrong.';
                errorBox.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
