<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chine — CineNova</title>
    <meta name="description" content="Chinese movies on CineNova.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="cinematic-page">
    <div class="site-cinematic-bg" aria-hidden="true">
        <div class="site-cinematic-bg__image"></div>
        <div class="site-cinematic-bg__scrim"></div>
    </div>

    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="sidebar-root"></div>

    <main id="main-content">

        <!-- ==================== CHINESE CINEMA HERO ==================== -->
        <section class="relative min-h-[72vh] lg:min-h-[82vh] flex items-end overflow-hidden catalog-hero" id="hero" aria-label="Chinese cinema hero">
            <div id="hero-bg" class="absolute inset-0 z-0 bg-cover bg-center catalog-hero-bg transition-all duration-[1500ms] ease-in-out">
                <div class="absolute inset-0 catalog-hero-overlay z-10"></div>
            </div>
            <div class="hero-poster-marquee absolute inset-0 z-[1]" aria-hidden="true">
                <div class="hero-poster-row hero-poster-row--one" id="hero-posters-one"></div>
                <div class="hero-poster-row hero-poster-row--two" id="hero-posters-two"></div>
            </div>
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative z-20 pb-12 lg:pb-16 pt-24">
                <div id="hero-content" class="text-center max-w-4xl mx-auto animate-fade-in-up">
                    <p class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-semibold text-orange-300 mb-4">
                        <span>🇨🇳</span> Chinese Cinema
                    </p>
                    <h1 id="hero-title" class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-white leading-tight drop-shadow-2xl">Chinese Movies</h1>
                    <div class="flex flex-wrap justify-center gap-3 mt-3 text-sm text-gray-300 font-medium">
                        <span id="hero-year" class="meta-pill font-mono"></span>
                        <span id="hero-rating" class="meta-pill meta-pill--rating"></span>
                    </div>
                    <p id="hero-desc" class="text-gray-200 mt-4 text-sm sm:text-base md:text-lg max-w-2xl mx-auto leading-relaxed drop-shadow-lg">Explore Chinese movies and discover your next favorite story.</p>
                    <div class="flex flex-wrap justify-center gap-4 mt-6">
                        <a id="hero-watch-btn" href="#" class="px-8 py-3 bg-gradient-to-r from-orange-500 to-orange-600 text-white font-bold rounded-full hover:shadow-xl hover:shadow-orange-500/40 hover:scale-105 transition-all duration-300">Watch Now</a>
                    </div>
                </div>
                <div class="mt-8 flex justify-center gap-3 overflow-x-auto hide-scrollbar pb-2 px-4" id="hero-thumbs"></div>
            </div>
        </section>

        <section class="reveal py-10 bg-black/40 backdrop-blur-sm relative z-10">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center mb-6">
                    <p class="text-orange-400 text-xs font-semibold uppercase tracking-[.18em]">Explore the collection</p>
                    <h2 class="text-2xl sm:text-3xl font-bold text-white mt-2">Chinese Movies</h2>
                    <p class="text-gray-400 mt-2 max-w-xl mx-auto">Chinese movies only, presented in a clean premium grid.</p>
                </div>
                <div id="china-loading" class="text-center text-gray-500 py-16">Loading Chinese movies…</div>
                <div id="china-empty" class="hidden text-center text-gray-500 py-16">No Chinese movies found.</div>
                <div id="china-grid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5"></div>
                <div id="china-loader" class="hidden flex justify-center py-8"><button id="china-load-more" type="button" class="px-5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white hover:bg-orange-500 transition">Load more</button></div>
            </div>
        </section>
    </main>

    <div id="footer-root"></div>
    <script src="../js/icons.js"></script>
    <script src="../js/cards.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/common.js" defer></script>
    <script>
    (function(){
      let page=1, totalPages=1, loading=false;
      const grid=document.getElementById('china-grid');
      const loadingEl=document.getElementById('china-loading');
      const emptyEl=document.getElementById('china-empty');
      const loader=document.getElementById('china-loader');
      const more=document.getElementById('china-load-more');

      CNSidebar.render({ activePage:'chine', mediaType:'movie' });
      CNFooter.render();

      function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
      function setText(id,value){ const el=document.getElementById(id); if(el) el.textContent=value||''; }
      function applyHero(item){
        const bg=document.getElementById('hero-bg');
        if(bg && item.backdrop_url) bg.style.backgroundImage="url('"+item.backdrop_url+"')";
        setText('hero-title', item.title || 'Chinese Movies');
        setText('hero-year', item.year || '');
        document.getElementById('hero-rating').innerHTML=cnIcon('star','w-3 h-3 text-yellow-400')+' '+Number(item.vote_average||0).toFixed(1);
        setText('hero-desc', item.overview || 'Explore Chinese movies and discover your next favorite story.');
        const btn=document.getElementById('hero-watch-btn');
        if(btn) btn.href=item.watch_url || '#';
      }
      function renderThumbs(items){
        const wrap=document.getElementById('hero-thumbs'); if(!wrap) return;
        wrap.innerHTML=items.slice(0,6).map(item=>
          '<button type="button" class="hero-thumb flex-shrink-0 w-[70px] sm:w-[90px] cursor-pointer rounded-lg overflow-hidden border-2 border-transparent bg-black/50 backdrop-blur-md hover:border-orange-500 transition-all duration-300 group" data-backdrop="'+esc(item.backdrop_url||'')+'" data-title="'+esc(item.title||'')+'" data-year="'+esc(item.year||'')+'" data-rating="'+Number(item.vote_average||0).toFixed(1)+'" data-desc="'+esc(item.overview||'')+'" data-url="'+esc(item.watch_url||'#')+'">'+
            '<img src="'+esc(item.poster_url||'')+'" alt="'+esc(item.title||'')+'" class="w-full h-full aspect-poster object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">'+
          '</button>'
        ).join('');
        wrap.querySelectorAll('.hero-thumb').forEach(thumb=>thumb.addEventListener('mouseenter',function(){
          const bg=document.getElementById('hero-bg'); if(bg&&thumb.dataset.backdrop) bg.style.backgroundImage="url('"+thumb.dataset.backdrop+"')";
          setText('hero-title',thumb.dataset.title); setText('hero-year',thumb.dataset.year);
          document.getElementById('hero-rating').innerHTML=cnIcon('star','w-3 h-3 text-yellow-400')+' '+thumb.dataset.rating;
          setText('hero-desc',thumb.dataset.desc); document.getElementById('hero-watch-btn').href=thumb.dataset.url||'#';
        }));
      }
      // Decorative drifting poster rows behind the hero — same treatment
      // as Home/Movies/Series/New Releases. Built from posters already
      // fetched for the hero, no extra requests.
      function buildHeroPosterMarquee(items){
        const posters=items.map(item=>item.poster_url).filter(Boolean);
        if(!posters.length) return;
        const rows=[document.getElementById('hero-posters-one'), document.getElementById('hero-posters-two')];
        rows.forEach(function(row, rowIndex){
          if(!row) return;
          const source = rowIndex ? posters.slice().reverse() : posters;
          const doubled = source.concat(source);
          row.innerHTML = doubled.map(url=>'<div class="hero-poster"><img src="'+esc(url)+'" alt="" loading="lazy" width="342" height="513"></div>').join('');
        });
      }
      fetch('../../backend/api/catalog.php?type=discover&media=movie&country=CN&page=1&limit=12')
        .then(r=>r.json()).then(res=>{ const items=(res.data&&res.data.items)||[]; if(items.length){applyHero(items[0]); renderThumbs(items); buildHeroPosterMarquee(items);} });


      function load(reset){
        if(loading) return; loading=true;
        fetch('../../backend/api/catalog.php?type=discover&media=movie&country=CN&page='+page+'&limit=24')
          .then(r=>r.json()).then(res=>{
            const data=res.data||{}, items=data.items||[]; totalPages=data.total_pages||1;
            if(reset) grid.innerHTML=''; items.forEach(item=>grid.insertAdjacentHTML('beforeend',CNCards.gridCardHtml(item)));
            loadingEl.classList.add('hidden'); grid.classList.remove('hidden');
            if(!items.length && page===1) emptyEl.classList.remove('hidden');
            loader.classList.toggle('hidden',page>=totalPages);
          }).catch(()=>{ loadingEl.classList.add('hidden'); if(page===1){emptyEl.textContent='Unable to load Chinese movies right now. Please try again.'; emptyEl.classList.remove('hidden');} })
          .finally(()=>loading=false);
      }
      more.addEventListener('click',()=>{page++;load(false);});
      load(true);
    })();
    </script>
</body>
</html>
