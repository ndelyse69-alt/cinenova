<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — CineNova Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/tailwind.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-shell" id="admin-shell-root"></div>

    <script src="../../js/icons.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        CNAdmin.init('categories', 'Categories', 'Genre labels used across the catalog').then(function () {
            const content = document.getElementById('admin-content');
            content.innerHTML =
                '<div class="admin-panel">' +
                    '<div class="admin-panel-head">' +
                        '<span class="admin-panel-title">All Categories</span>' +
                        '<form id="add-form" class="flex gap-2"><input type="text" id="add-name" class="admin-input" placeholder="New category name" required><button class="admin-btn admin-btn-primary" type="submit">' + cnIcon('plus', 'w-4 h-4') + ' Add</button></form>' +
                    '</div>' +
                    '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Slug</th><th></th></tr></thead><tbody id="table-body"></tbody></table></div>' +
                '</div>';

            function load() {
                CNAdmin.get('../../../backend/api/admin/categories.php').then(function (res) {
                    const rows = res.data.categories || [];
                    document.getElementById('table-body').innerHTML = rows.length ? rows.map((c) =>
                        '<tr data-id="' + c.id + '">' +
                            '<td class="admin-cell-title" data-field="name">' + CNAdmin.esc(c.name) + '</td>' +
                            '<td class="text-gray-500">' + CNAdmin.esc(c.slug) + '</td>' +
                            '<td><div class="flex gap-2 justify-end">' +
                                '<button class="admin-icon-btn" data-action="edit" title="Rename">' + cnIcon('edit', 'w-4 h-4') + '</button>' +
                                '<button class="admin-icon-btn admin-icon-btn--danger" data-action="delete" title="Delete">' + cnIcon('trash', 'w-4 h-4') + '</button>' +
                            '</div></td>' +
                        '</tr>'
                    ).join('') : '<tr><td colspan="3" class="admin-table-empty">No categories yet.</td></tr>';
                });
            }

            document.getElementById('add-form').addEventListener('submit', function (e) {
                e.preventDefault();
                const input = document.getElementById('add-name');
                CNAdmin.post('../../../backend/api/admin/categories.php', { action: 'create', name: input.value })
                    .then(() => { input.value = ''; CNAdmin.flash('success', 'Category added.'); load(); })
                    .catch((err) => CNAdmin.flash('error', err.message));
            });

            document.getElementById('table-body').addEventListener('click', function (e) {
                const row = e.target.closest('tr');
                if (!row) return;
                const id = row.dataset.id;

                if (e.target.closest('[data-action="delete"]')) {
                    if (!confirm('Delete this category?')) return;
                    CNAdmin.post('../../../backend/api/admin/categories.php', { action: 'delete', id: id })
                        .then(() => { CNAdmin.flash('success', 'Category removed.'); load(); });
                }
                if (e.target.closest('[data-action="edit"]')) {
                    const current = row.querySelector('[data-field="name"]').textContent;
                    const name = prompt('Rename category', current);
                    if (!name || name === current) return;
                    CNAdmin.post('../../../backend/api/admin/categories.php', { action: 'update', id: id, name: name })
                        .then(() => { CNAdmin.flash('success', 'Category updated.'); load(); })
                        .catch((err) => CNAdmin.flash('error', err.message));
                }
            });

            load();
        });
    </script>
</body>
</html>
