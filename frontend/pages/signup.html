<!DOCTYPE html>
<html lang="en" class="auth-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign Up — CineNova</title>
    <meta name="description" content="Create your free CineNova account.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="no-sidebar auth-page">
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <main id="main-content" class="auth-shell">
        <div class="auth-card-outer">

            <!-- ==================== LEFT — BRAND PANEL ==================== -->
            <div class="auth-panel-brand">
                <div class="auth-poster-marquee hidden lg:flex" id="poster-marquee" aria-hidden="true"></div>
                <div class="auth-poster-overlay"></div>

                <div class="auth-panel-content">
                <a href="index.html" class="flex items-center gap-2" aria-label="CineNova — home">
                    <img src="../images/logo.png" alt="CineNova" class="h-8 w-8 object-contain flex-shrink-0" width="615" height="640" />
                    <span class="text-base font-bold text-white tracking-tight">Cine<span class="text-orange-500">Nova</span></span>
                </a>

                <div class="mt-3 sm:mt-6 lg:mt-8">
                    <p class="auth-eyebrow" id="auth-eyebrow"></p>
                    <h1 class="mt-1.5 text-xl sm:text-3xl lg:text-4xl font-extrabold text-white leading-tight">
                        Create your<br><span class="text-orange-500">Account</span>
                    </h1>
                    <p class="hidden sm:block mt-3 text-sm text-gray-400 leading-relaxed max-w-xs">
                        Sign up and explore thousands of movies and series.
                    </p>
                </div>

                <div class="hidden sm:block mt-6 lg:mt-8 space-y-3" id="auth-features"></div>

                <p class="hidden sm:block text-[11px] text-gray-500 mt-auto pt-6" id="auth-copyright"></p>
                </div>
            </div>

            <!-- ==================== RIGHT — SIGN UP FORM ==================== -->
            <div class="auth-panel-form">
                <div class="auth-form-card">
                    <div id="signup-success" class="hidden text-center py-6">
                        <div class="mx-auto mb-4 h-12 w-12 rounded-full bg-orange-500/15 flex items-center justify-center" id="signup-success-icon"></div>
                        <h2 class="text-lg font-semibold text-white mb-2">Welcome to CineNova!</h2>
                        <p class="text-sm text-gray-400 leading-relaxed">Your account was created and you're signed in.</p>
                        <a href="index.html" class="auth-submit-btn inline-flex mt-6">Start Watching</a>
                    </div>

                    <div id="signup-form-wrap">
                        <h2 class="text-xl sm:text-2xl font-bold text-white">Sign up</h2>
                        <p class="hidden sm:block mt-1 text-sm text-gray-400">Create your account to get started.</p>

                        <div role="alert" id="auth-error" class="hidden mt-3 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-2.5 text-xs text-red-200"></div>

                        <form id="signup-form" novalidate class="mt-3 sm:mt-4 space-y-2.5 sm:space-y-3">
                            <div>
                                <label for="username" class="block text-xs font-semibold text-gray-300 mb-1">Username</label>
                                <div class="auth-input-wrap">
                                    <input type="text" id="username" name="username" required autocomplete="username" pattern="[a-zA-Z0-9_]{3,20}" class="auth-input" placeholder="Choose a username">
                                    <span class="auth-input-icon" id="icon-user"></span>
                                </div>
                            </div>
                            <div>
                                <label for="email" class="block text-xs font-semibold text-gray-300 mb-1">Email address</label>
                                <div class="auth-input-wrap">
                                    <input type="email" id="email" name="email" required autocomplete="email" class="auth-input" placeholder="Enter your email">
                                    <span class="auth-input-icon" id="icon-mail"></span>
                                </div>
                            </div>
                            <div>
                                <label for="password" class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                                <div class="auth-input-wrap">
                                    <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" class="auth-input" placeholder="Create a password">
                                    <span class="auth-input-icon" id="icon-lock-1"></span>
                                </div>
                            </div>
                            <div>
                                <label for="confirm_password" class="block text-xs font-semibold text-gray-300 mb-1">Confirm password</label>
                                <div class="auth-input-wrap">
                                    <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password" class="auth-input" placeholder="Confirm your password">
                                    <span class="auth-input-icon" id="icon-lock-2"></span>
                                </div>
                            </div>

                            <label class="flex items-start gap-2.5 text-xs text-gray-300 cursor-pointer select-none">
                                <input type="checkbox" name="agree_terms" required class="auth-check mt-0.5">
                                <span>I agree to the <a href="#" class="text-orange-400 font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-orange-400 font-semibold hover:underline">Privacy Policy</a>.</span>
                            </label>

                            <button type="submit" id="signup-submit" class="auth-submit-btn">Sign up <span id="icon-chevron"></span></button>
                        </form>

                        <div class="auth-divider my-3 sm:my-4">or continue with</div>

                        <div class="grid grid-cols-3 gap-3">
                            <button type="button" class="auth-social-btn" aria-label="Continue with Google" id="btn-google"></button>
                            <button type="button" class="auth-social-btn" aria-label="Continue with Apple" id="btn-apple"></button>
                            <button type="button" class="auth-social-btn" aria-label="Continue with Facebook" id="btn-facebook"></button>
                        </div>

                        <p class="text-center text-sm text-gray-400 mt-3 sm:mt-4">
                            Already have an account? <a href="login.html" class="text-orange-400 font-semibold hover:underline">Login</a>
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="../js/icons.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/common.js" defer></script>
    <script>
        document.getElementById('icon-user').innerHTML = cnIcon('user', 'w-[1.125rem] h-[1.125rem]');
        document.getElementById('icon-mail').innerHTML = cnIcon('mail', 'w-[1.125rem] h-[1.125rem]');
        document.getElementById('icon-lock-1').innerHTML = cnIcon('lock', 'w-[1.125rem] h-[1.125rem]');
        document.getElementById('icon-lock-2').innerHTML = cnIcon('lock', 'w-[1.125rem] h-[1.125rem]');
        document.getElementById('icon-chevron').innerHTML = cnIcon('chevron', 'w-4 h-4');
        document.getElementById('auth-eyebrow').innerHTML = cnIcon('sparkle', 'w-3.5 h-3.5') + ' Join Us Today';
        document.getElementById('signup-success-icon').innerHTML = cnIcon('check', 'w-6 h-6 text-orange-400');
        document.getElementById('auth-copyright').innerHTML = '&copy; ' + new Date().getFullYear() + ' CineNova. All rights reserved.<br>Watch more. Discover more.';
        document.getElementById('btn-google').innerHTML = cnIcon('google', 'w-5 h-5');
        document.getElementById('btn-apple').innerHTML = cnIcon('apple', 'w-5 h-5');
        document.getElementById('btn-facebook').innerHTML = cnIcon('facebook', 'w-5 h-5');

        const FEATURES = [
            { icon: 'play', title: 'Unlimited Entertainment', desc: 'Watch anywhere, anytime.' },
            { icon: 'star', title: 'Personalized Experience', desc: "Get recommendations you'll love." },
            { icon: 'shield', title: 'Secure & Private', desc: 'Your data is always protected.' },
        ];
        document.getElementById('auth-features').innerHTML = FEATURES.map((f) =>
            '<div class="auth-feature-row"><span class="auth-feature-icon">' + cnIcon(f.icon, 'w-[1.125rem] h-[1.125rem]') + '</span>' +
            '<div><p class="text-sm font-bold text-white">' + f.title + '</p><p class="text-xs text-gray-400 mt-0.5">' + f.desc + '</p></div></div>'
        ).join('');

        CNAuth.me().then((state) => { if (state.authenticated) window.location.href = 'index.html'; });

        fetch('../../backend/api/catalog.php?type=trending&media=movie&limit=18')
            .then((r) => r.json())
            .then((res) => {
                const items = (res.data && res.data.items) || [];
                const posters = items.map((i) => i.poster_url).filter(Boolean);
                if (posters.length === 0) return;
                const cols = [[], [], []];
                for (let i = 0; i < 18; i++) cols[i % 3].push(posters[i % posters.length]);
                document.getElementById('poster-marquee').innerHTML = cols.map((col, i) =>
                    '<div class="auth-poster-col ' + (i === 1 ? 'auth-poster-col--down' : 'auth-poster-col--slow') + '">' +
                        col.concat(col).map((src) => '<div class="auth-poster-card"><img src="' + src + '" alt="" loading="lazy"></div>').join('') +
                    '</div>'
                ).join('');
            });

        const form = document.getElementById('signup-form');
        const errorBox = document.getElementById('auth-error');
        const submitBtn = document.getElementById('signup-submit');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errorBox.classList.add('hidden');

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            if (!document.querySelector('[name="agree_terms"]').checked) {
                errorBox.textContent = 'Please agree to the Terms of Service and Privacy Policy.';
                errorBox.classList.remove('hidden');
                return;
            }
            if (password !== confirm) {
                errorBox.textContent = 'Passwords do not match.';
                errorBox.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            CNAuth.signup(
                document.getElementById('username').value.trim(),
                document.getElementById('email').value.trim(),
                password,
                confirm
            ).then(() => {
                document.getElementById('signup-success').classList.remove('hidden');
                document.getElementById('signup-form-wrap').classList.add('hidden');
            }).catch((err) => {
                submitBtn.disabled = false;
                errorBox.textContent = err.message || 'Something went wrong. Please try again.';
                errorBox.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
